# Prometheus scrapes agentgateway and nothing else, as the agentgateway Helm chart
# (agentgateway-standalone) recommends: /metrics on the stats port 15020 every
# 15s, classic histograms. vLLM, Codebox and Prometheus itself are not scraped.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # config.statsAddr in agentgateway/config.yaml
  - job_name: agentgateway
    metrics_path: /metrics
    static_configs:
      - targets: ["agentgateway:15020"]
