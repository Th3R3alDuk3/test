apiVersion: 1

# Grafana reads agentgateway metrics through Prometheus only. Single requests
# are in the agentgateway admin UI (http://127.0.0.1:15000/ui/llm/logs).
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
